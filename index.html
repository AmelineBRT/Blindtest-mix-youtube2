<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blind Mix</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            color: #222;
        }


        /* =========================
           EN-TÊTE
           ========================= */

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }


        header h1 {
            margin: 0;
            font-size: 32px;
        }


        header p {
            margin-bottom: 0;
        }


        /* =========================
           CONTENU PRINCIPAL
           ========================= */

        main {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }


        /* =========================
           BOUTONS
           ========================= */

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 15px;
            cursor: pointer;
            margin: 3px;
        }


        button:hover {
            opacity: 0.85;
        }


        .primary {
            background: #35a853;
            color: white;
        }


        .secondary {
            background: #555;
            color: white;
        }


        .danger {
            background: #ea4335;
            color: white;
        }


        .blue {
            background: #4285f4;
            color: white;
        }


        /* =========================
           ÉCRANS
           ========================= */

        .screen {
            display: none;
        }


        .screen.active {
            display: block;
        }


        /* =========================
           CARTES
           ========================= */

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }


        /* =========================
           FORMULAIRES
           ========================= */

        input {
            width: 100%;
            padding: 11px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }


        label {
            font-weight: bold;
        }


        /* =========================
           MOT DE PASSE
           ========================= */

        .password-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }


        .password-container input {
            flex: 1;
            margin-bottom: 12px;
        }


        .password-container button {
            margin: 6px 0 12px 0;
            padding: 10px 12px;
        }


        /* =========================
           LISTE DES PARTIES
           ========================= */

        .game-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }


        .game-card h3 {
            margin-top: 0;
        }


        .game-info {
            color: #666;
            margin-bottom: 10px;
        }


        /* =========================
           MANCHES
           ========================= */

        .round-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }


        .round-card h3 {
            margin-top: 0;
        }


        /* =========================
           PISTES
           ========================= */

        .track {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }


        .track h3 {
            margin-top: 0;
        }


        .player {
            width: 100%;
            min-height: 200px;
            margin-top: 10px;
        }


        .track-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }


        .volume {
            width: 150px;
        }


        /* =========================
           LECTURE
           ========================= */

        .play-all {
            width: 100%;
            font-size: 20px;
            padding: 15px;
            margin-bottom: 20px;
        }


        .pause-all {
            width: 100%;
            font-size: 18px;
            padding: 13px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            main {
                padding: 10px;
            }


            header h1 {
                font-size: 26px;
            }


            button {
                width: 100%;
                margin: 4px 0;
            }


            .track-controls button {
                width: auto;
            }


            .volume {
                width: 100%;
            }


            .password-container button {
                width: auto;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>🎵 Blind Mix</h1>

    <p>Ton lecteur de Blind Test</p>

</header>



<main>


    <!-- ==================================================
         ÉCRAN : LISTE DES PARTIES
         ================================================== -->

    <section id="gamesScreen" class="screen active">

        <div class="card">

            <h2>🎮 Mes parties</h2>

            <button
                class="primary"
                onclick="showCreateGame()">

                ＋ Nouvelle partie

            </button>

        </div>


        <div id="gamesList"></div>

    </section>



    <!-- ==================================================
         ÉCRAN : CRÉER UNE PARTIE
         ================================================== -->

    <section id="createGameScreen" class="screen">

        <div class="card">

            <h2>🎮 Nouvelle partie</h2>


            <label>
                Nom de la partie
            </label>

            <input
                id="gameName"
                type="text"
                placeholder="Ex : Blind Test Noël">


            <label>
                Créé par
            </label>

            <input
                id="gameCreator"
                type="text"
                placeholder="Ton prénom">


            <label>
                Mot de passe
                (facultatif)
            </label>

            <div class="password-container">

                <input
                    id="gamePassword"
                    type="password"
                    placeholder="Laisser vide si aucun mot de passe">

                <button
                    type="button"
                    class="secondary"
                    onclick="togglePassword('gamePassword', this)">

                    👁️

                </button>

            </div>


            <button
                class="primary"
                onclick="createGame()">

                💾 Créer la partie

            </button>


            <button
                class="secondary"
                onclick="showGames()">

                ← Retour

            </button>

        </div>

    </section>



    <!-- ==================================================
         ÉCRAN : GESTION D'UNE PARTIE
         ================================================== -->

    <section id="gameScreen" class="screen">

        <div class="card">

            <h2 id="gameTitle"></h2>

            <p id="gameCreatorDisplay"></p>


            <button
                class="primary"
                onclick="showCreateRound()">

                ＋ Ajouter une manche

            </button>


            <button
                class="blue"
                onclick="startGame()">

                🎮 Jouer la partie

            </button>


            <button
                class="secondary"
                onclick="showEditGame()">

                ⚙️ Modifier la partie

            </button>


            <button
                class="secondary"
                onclick="showGames()">

                ← Mes parties

            </button>

        </div>


        <div id="roundsList"></div>

    </section>



    <!-- ==================================================
         ÉCRAN : MODIFIER UNE PARTIE
         ================================================== -->

    <section id="editGameScreen" class="screen">

        <div class="card">

            <h2>⚙️ Modifier la partie</h2>


            <label>
                Nom de la partie
            </label>

            <input
                id="editGameName"
                type="text"
                placeholder="Nom de la partie">


            <label>
                Créé par
            </label>

            <input
                id="editGameCreator"
                type="text"
                placeholder="Nom du créateur">


            <label>
                Mot de passe
            </label>

            <div class="password-container">

                <input
                    id="editGamePassword"
                    type="password"
                    placeholder="Laisser vide pour supprimer le mot de passe">

                <button
                    type="button"
                    class="secondary"
                    onclick="togglePassword('editGamePassword', this)">

                    👁️

                </button>

            </div>


            <button
                class="primary"
                onclick="saveGameChanges()">

                💾 Enregistrer les modifications

            </button>


            <button
                class="danger"
                onclick="deleteCurrentGame()">

                🗑️ Supprimer cette partie

            </button>


            <button
                class="secondary"
                onclick="showGame()">

                ← Retour

            </button>

        </div>

    </section>



    <!-- ==================================================
         ÉCRAN : CRÉER UNE MANCHE
         ================================================== -->

    <section id="createRoundScreen" class="screen">

        <div class="card">

            <h2>🎵 Nouvelle manche</h2>


            <label>
                Nom de la manche
            </label>

            <input
                id="roundName"
                type="text"
                placeholder="Ex : Années 2000">


            <button
                class="primary"
                onclick="createRound()">

                💾 Créer la manche

            </button>


            <button
                class="secondary"
                onclick="showGame()">

                ← Retour

            </button>

        </div>

    </section>



    <!-- ==================================================
         ÉCRAN : PRÉPARATION D'UNE MANCHE
         ================================================== -->

    <section id="editRoundScreen" class="screen">

        <div class="card">

            <h2 id="editRoundTitle"></h2>

            <p>
                Ajoute jusqu'à 7 liens YouTube.
            </p>


            <div id="editTracks"></div>


            <button
                class="primary"
                onclick="saveRound()">

                💾 Enregistrer la manche

            </button>


            <button
                class="secondary"
                onclick="showGame()">

                ← Retour

            </button>

        </div>

    </section>



    <!-- ==================================================
         ÉCRAN : JEU
         ================================================== -->

    <section id="playScreen" class="screen">

        <div class="card">

            <h2 id="playGameTitle"></h2>

            <h3 id="playRoundTitle"></h3>


            <button
                class="primary play-all"
                onclick="playAll()">

                ▶️ LANCER LE MIX

            </button>


            <button
                class="danger pause-all"
                onclick="pauseAll()">

                ⏸️ PAUSE TOUT

            </button>

        </div>


        <div id="playTracks"></div>


        <button
            class="secondary"
            onclick="nextRound()">

            ➡️ Manche suivante

        </button>


        <button
            class="secondary"
            onclick="showGame()">

            ← Quitter le jeu

        </button>

    </section>


</main>



<!-- ======================================================
     API YOUTUBE
     ====================================================== -->

<script src="https://www.youtube.com/iframe_api"></script>



<script>


/* ========================================================
   VARIABLES PRINCIPALES
   ======================================================== */


let games = [];

let currentGameId = null;

let currentRoundId = null;

let players = [];



/* ========================================================
   CHARGEMENT DES DONNÉES
   ======================================================== */


function loadData() {

    const savedGames =
        localStorage.getItem("blindMixGames");


    if (savedGames) {

        games = JSON.parse(savedGames);

    }

}



/* ========================================================
   SAUVEGARDE DES DONNÉES
   ======================================================== */


function saveData() {

    localStorage.setItem(
        "blindMixGames",
        JSON.stringify(games)
    );

}



/* ========================================================
   CHANGER D'ÉCRAN
   ======================================================== */


function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(function(screen) {

            screen.classList.remove("active");

        });


    document
        .getElementById(screenId)
        .classList.add("active");

}



/* ========================================================
   ÉCRAN DES PARTIES
   ======================================================== */


function showGames() {

    showScreen("gamesScreen");

    renderGames();

}



/* ========================================================
   AFFICHER LES PARTIES
   ======================================================== */


function renderGames() {

    const container =
        document.getElementById("gamesList");


    container.innerHTML = "";


    if (games.length === 0) {

        container.innerHTML =
            "<div class='card'>" +
            "Aucune partie pour le moment." +
            "</div>";

        return;

    }


    games.forEach(function(game) {


        const div =
            document.createElement("div");


        div.className = "game-card";


        const passwordIcon =
            game.password
            ? " 🔒"
            : " 🔓";


        div.innerHTML = `

            <h3>
                🎵 ${escapeHTML(game.name)}
                ${passwordIcon}
            </h3>

            <div class="game-info">
                Créé par :
                ${escapeHTML(game.creator)}
            </div>

            <div class="game-info">
                ${game.rounds.length} manche(s)
            </div>

            <button
                class="blue"
                onclick="openGame('${game.id}')">

                Ouvrir

            </button>

            <button
                class="danger"
                onclick="deleteGame('${game.id}')">

                Supprimer

            </button>

        `;


        container.appendChild(div);

    });

}



/* ========================================================
   CRÉER UNE PARTIE
   ======================================================== */


function showCreateGame() {

    document.getElementById("gameName").value = "";

    document.getElementById("gameCreator").value = "";

    document.getElementById("gamePassword").value = "";


    showScreen("createGameScreen");

}



function createGame() {

    const name =
        document.getElementById("gameName").value.trim();


    const creator =
        document.getElementById("gameCreator").value.trim();


    const password =
        document.getElementById("gamePassword").value;


    if (!name) {

        alert("Donne un nom à ta partie.");

        return;

    }


    if (!creator) {

        alert("Indique qui a créé la partie.");

        return;

    }


    const game = {

        id: Date.now().toString(),

        name: name,

        creator: creator,

        password: password,

        rounds: []

    };


    games.push(game);


    saveData();


    currentGameId = game.id;


    showGame();

}



/* ========================================================
   AFFICHER / MASQUER UN MOT DE PASSE
   ======================================================== */


function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);


    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

    } else {

        input.type = "password";

        button.textContent = "👁️";

    }

}



/* ========================================================
   OUVRIR UNE PARTIE
   ======================================================== */


function openGame(id) {

    const game =
        games.find(function(g) {

            return g.id === id;

        });


    if (!game) {
        return;
    }


    if (game.password) {

        const enteredPassword =
            prompt("Mot de passe de cette partie :");


        if (enteredPassword !== game.password) {

            alert("Mot de passe incorrect.");

            return;

        }

    }


    currentGameId = id;


    showGame();

}



/* ========================================================
   AFFICHER UNE PARTIE
   ======================================================== */


function showGame() {

    const game = getCurrentGame();


    if (!game) {
        return;
    }


    document.getElementById("gameTitle").textContent =
        "🎵 " + game.name;


    document.getElementById("gameCreatorDisplay").textContent =
        "Créé par : " + game.creator;


    renderRounds();


    showScreen("gameScreen");

}



/* ========================================================
   MODIFIER UNE PARTIE
   ======================================================== */


function showEditGame() {

    const game = getCurrentGame();


    if (!game) {
        return;
    }


    document.getElementById("editGameName").value =
        game.name;


    document.getElementById("editGameCreator").value =
        game.creator;


    document.getElementById("editGamePassword").value =
        game.password || "";


    showScreen("editGameScreen");

}



/* ========================================================
   ENREGISTRER LES MODIFICATIONS D'UNE PARTIE
   ======================================================== */


function saveGameChanges() {

    const game = getCurrentGame();


    if (!game) {
        return;
    }


    const name =
        document.getElementById("editGameName").value.trim();


    const creator =
        document.getElementById("editGameCreator").value.trim();


    const password =
        document.getElementById("editGamePassword").value;


    if (!name) {

        alert("Donne un nom à ta partie.");

        return;

    }


    if (!creator) {

        alert("Indique qui a créé la partie.");

        return;

    }


    game.name = name;

    game.creator = creator;

    game.password = password;


    saveData();


    alert("Partie modifiée !");


    showGame();

}



/* ========================================================
   SUPPRIMER LA PARTIE ACTUELLE
   ======================================================== */


function deleteCurrentGame() {

    const game = getCurrentGame();


    if (!game) {
        return;
    }


    if (
        !confirm(
            "Supprimer cette partie et toutes ses manches ?"
        )
    ) {

        return;

    }


    games =
        games.filter(function(g) {

            return g.id !== game.id;

        });


    currentGameId = null;

    currentRoundId = null;


    saveData();


    showGames();

}



/* ========================================================
   AFFICHER LES MANCHES
   ======================================================== */


function renderRounds() {

    const game = getCurrentGame();


    const container =
        document.getElementById("roundsList");


    container.innerHTML = "";


    if (game.rounds.length === 0) {

        container.innerHTML =
            "<div class='card'>" +
            "Cette partie ne contient encore aucune manche." +
            "</div>";

        return;

    }


    game.rounds.forEach(function(round, index) {


        const div =
            document.createElement("div");


        div.className = "round-card";


        div.innerHTML = `

            <h3>
                Manche ${index + 1} —
                ${escapeHTML(round.name)}
            </h3>

            <p>
                ${round.tracks.length}/7 piste(s) préparée(s)
            </p>

            <button
                class="blue"
                onclick="editRound('${round.id}')">

                ✏️ Modifier

            </button>

            <button
                class="secondary"
                onclick="duplicateRound('${round.id}')">

                📋 Dupliquer

            </button>

            <button
                class="danger"
                onclick="deleteRound('${round.id}')">

                🗑️ Supprimer

            </button>

        `;


        container.appendChild(div);

    });

}



/* ========================================================
   CRÉER UNE MANCHE
   ======================================================== */


function showCreateRound() {

    document.getElementById("roundName").value = "";

    showScreen("createRoundScreen");

}



function createRound() {

    const name =
        document.getElementById("roundName").value.trim();


    if (!name) {

        alert("Donne un nom à la manche.");

        return;

    }


    const game = getCurrentGame();


    const round = {

        id: Date.now().toString(),

        name: name,

        tracks: []

    };


    for (let i = 0; i < 7; i++) {

        round.tracks.push({

            title: "Piste " + (i + 1),

            url: ""

        });

    }


    game.rounds.push(round);


    saveData();


    editRound(round.id);

}



/* ========================================================
   MODIFIER UNE MANCHE
   ======================================================== */


function editRound(roundId) {

    currentRoundId = roundId;


    const game = getCurrentGame();


    const round =
        game.rounds.find(function(r) {

            return r.id === roundId;

        });


    if (!round) {
        return;
    }


    document.getElementById("editRoundTitle").textContent =
        "🎵 " + round.name;


    renderEditTracks(round);


    showScreen("editRoundScreen");

}



/* ========================================================
   AFFICHER LES 7 PISTES EN MODE PRÉPARATION
   ======================================================== */


function renderEditTracks(round) {

    const container =
        document.getElementById("editTracks");


    container.innerHTML = "";


    for (let i = 0; i < 7; i++) {


        const track =
            round.tracks[i];


        const div =
            document.createElement("div");


        div.className = "track";


        div.innerHTML = `

            <h3>🎵 Piste ${i + 1}</h3>

            <label>
                Nom / réponse
            </label>

            <input
                id="title-${i}"
                type="text"
                value="${escapeAttribute(track.title)}"
                placeholder="Ex : Michael Jackson">


            <label>
                Lien YouTube
            </label>

            <input
                id="url-${i}"
                type="text"
                value="${escapeAttribute(track.url)}"
                placeholder="Colle ici le lien YouTube">

        `;


        container.appendChild(div);

    }

}



/* ========================================================
   ENREGISTRER UNE MANCHE
   ======================================================== */


function saveRound() {

    const game = getCurrentGame();


    const round =
        game.rounds.find(function(r) {

            return r.id === currentRoundId;

        });


    if (!round) {
        return;
    }


    for (let i = 0; i < 7; i++) {

        round.tracks[i].title =
            document.getElementById("title-" + i).value;


        round.tracks[i].url =
            document.getElementById("url-" + i).value;

    }


    saveData();


    alert("Manche enregistrée !");


    showGame();

}



/* ========================================================
   DUPLIQUER UNE MANCHE
   ======================================================== */


function duplicateRound(roundId) {

    const game = getCurrentGame();


    const original =
        game.rounds.find(function(r) {

            return r.id === roundId;

        });


    if (!original) {
        return;
    }


    const copy =
        JSON.parse(JSON.stringify(original));


    copy.id =
        Date.now().toString();


    copy.name =
        original.name + " - Copie";


    game.rounds.push(copy);


    saveData();


    renderRounds();

}



/* ========================================================
   SUPPRIMER UNE MANCHE
   ======================================================== */


function deleteRound(roundId) {

    if (!confirm("Supprimer cette manche ?")) {
        return;
    }


    const game = getCurrentGame();


    game.rounds =
        game.rounds.filter(function(round) {

            return round.id !== roundId;

        });


    saveData();


    renderRounds();

}



/* ========================================================
   SUPPRIMER UNE PARTIE
   ======================================================== */


function deleteGame(gameId) {

    if (!confirm("Supprimer cette partie et toutes ses manches ?")) {
        return;
    }


    games =
        games.filter(function(game) {

            return game.id !== gameId;

        });


    saveData();


    renderGames();

}



/* ========================================================
   LANCER UNE PARTIE
   ======================================================== */


function startGame() {

    const game = getCurrentGame();


    if (!game) {
        return;
    }


    if (game.rounds.length === 0) {

        alert("Cette partie ne contient aucune manche.");

        return;

    }


    currentRoundId =
        game.rounds[0].id;


    loadRoundForPlaying();

}



/* ========================================================
   CHARGER UNE MANCHE POUR LE JEU
   ======================================================== */


function loadRoundForPlaying() {

    const game = getCurrentGame();


    const round =
        game.rounds.find(function(r) {

            return r.id === currentRoundId;

        });


    if (!round) {
        return;
    }


    players = [];


    document.getElementById("playGameTitle").textContent =
        "🎵 " + game.name;


    document.getElementById("playRoundTitle").textContent =
        "Manche : " + round.name;


    renderPlayTracks(round);


    showScreen("playScreen");

}



/* ========================================================
   AFFICHER LES LECTEURS
   ======================================================== */


function renderPlayTracks(round) {

    const container =
        document.getElementById("playTracks");


    container.innerHTML = "";


    round.tracks.forEach(function(track, index) {


        if (!track.url) {
            return;
        }


        const videoId =
            getVideoId(track.url);


        if (!videoId) {
            return;
        }


        const div =
            document.createElement("div");


        div.className = "track";


        div.innerHTML = `

            <h3>
                🎵 ${escapeHTML(track.title)}
            </h3>

            <div
                id="player-${index}"
                class="player">
            </div>

            <div class="track-controls">

                <button
                    class="primary"
                    onclick="playTrack(${index})">

                    ▶️

                </button>

                <button
                    class="danger"
                    onclick="pauseTrack(${index})">

                    ⏸️

                </button>

                <span>🔊</span>

                <input
                    class="volume"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                    oninput="changeVolume(${index}, this.value)">

            </div>

        `;


        container.appendChild(div);


        createPlayer(
            index,
            videoId
        );

    });

}



/* ========================================================
   EXTRAIRE L'ID YOUTUBE
   ======================================================== */


function getVideoId(url) {

    try {

        const urlObject =
            new URL(url);


        if (
            urlObject.hostname.includes("youtube.com")
        ) {

            return urlObject.searchParams.get("v");

        }


        if (
            urlObject.hostname.includes("youtu.be")
        ) {

            return urlObject.pathname.substring(1);

        }

    } catch (error) {

        return null;

    }


    return null;

}



/* ========================================================
   CRÉER UN LECTEUR YOUTUBE
   ======================================================== */


function createPlayer(index, videoId) {


    players[index] =
        new YT.Player(
            "player-" + index,
            {

                videoId: videoId,

                playerVars: {

                    autoplay: 0,

                    controls: 1,

                    rel: 0,

                    playsinline: 1

                },

                events: {

                    onReady: function(event) {

                        event.target.setVolume(100);

                    }

                }

            }
        );

}

   ======================================================== */


function changeVolume(index, volume) {

    if (
        players[index] &&
        typeof players[index].setVolume === "function"
    ) {

        players[index].setVolume(
            Number(volume)
        );

    }

}



/* ========================================================

function playAll() {

    players.forEach(function(player) {

            typeof player.playVideo === "function"
        ) {

            player.playVideo();

        }

    });

}



/* ========================================================

function pauseAll() {

        ) {

        }

    });

}



/* ========================================================
   MANCHE SUIVANTE
   ======================================================== */


function nextRound() {

    const game = getCurrentGame();


    const currentIndex =
        game.rounds.findIndex(function(round) {

            return round.id === currentRoundId;

        });


    if (
        currentIndex === -1 ||
        currentIndex >= game.rounds.length - 1
    ) {

        alert(
            "C'était la dernière manche !"
        );

        return;

    }


    pauseAll();


    currentRoundId =
        game.rounds[currentIndex + 1].id;


    loadRoundForPlaying();

}



/* ========================================================
   RÉCUPÉRER LA PARTIE ACTUELLE
   ======================================================== */


function getCurrentGame() {

    return games.find(function(game) {

        return game.id === currentGameId;

    });

}



/* ========================================================
   PROTECTION DE L'AFFICHAGE
   ======================================================== */


function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



function escapeAttribute(text) {

    return escapeHTML(text);

}

<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Blindtest Mix</title><style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}


/* =========================================================
   EN-TÊTE
   ========================================================= */

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 8px 20px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}


/* =========================================================
   CONTENU PRINCIPAL
   ========================================================= */

main {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}


/* =========================================================
   BOUTONS
   ========================================================= */

button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
    margin: 3px;
    transition: opacity 0.15s ease;
}

button:hover {
    opacity: 0.85;
}

button:disabled {
    opacity: 0.35;
    cursor: default;
}


/* Vert bouteille */

.primary {
    background: #720038;
    color: white;
}


/* Bleu canard */

.blue {
    background: #09463E;
    color: white;
}


/* Gris foncé */

.secondary {
    background: #777;
    color: white;
}


/* Gris clair */

.light {
    background: #e1e1e1;
    color: #333;
}


/* Rouge */

.danger {
    background: #B73434;
    color: white;
}


/* Play cassis */

.play-button {
    background: #720038;
    color: white;
}


/* Pause bleu canard */

.pause-button {
    background: #09463E;
    color: white;
}


/* Manche suivante */

.next-round {
    background: #b8e6c1;
    color: #174d25;
}


/* Manche précédente */

.previous-round {
    background: #ead8c7;
    color: #6d5139;
}


/* Quitter */

.quit-game {
    background: #ddd;
    color: #333;
    font-size: 12px;
    padding: 7px 11px;
}


/* Fin de partie */

.finish-game {
    background: #e6a83a;
    color: #4b3500;
}


/* =========================================================
   ÉCRANS
   ========================================================= */

.screen {
    display: none;
}

.screen.active {
    display: block;
}


/* =========================================================
   CARTES
   ========================================================= */

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}


/* =========================================================
   FORMULAIRES
   ========================================================= */

input,
select {
    width: 100%;
    padding: 11px;
    margin: 6px 0 12px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

label {
    font-weight: bold;
}


/* =========================================================
   MOT DE PASSE
   ========================================================= */

.password-container {
    display: flex;
    align-items: center;
    gap: 6px;
}

.password-container input {
    flex: 1;
    margin-bottom: 12px;
}

.password-container button {
    margin: 6px 0 12px 0;
    padding: 10px 12px;
}


/* =========================================================
   FILTRE DES PARTIES
   ========================================================= */

.filter-container {
    margin-top: 15px;
}

.filter-container label {
    display: block;
    margin-bottom: 4px;
}

.filter-container select {
    margin-bottom: 0;
}


/* =========================================================
   LISTE DES PARTIES
   ========================================================= */

.game-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.game-card h3 {
    margin-top: 0;
}

.game-info {
    color: #666;
    margin-bottom: 10px;
}

.game-info .creator-label {
    font-size: 12px;
    color: #888;
}

.game-info .creator-name {
    font-size: 15px;
    color: #555;
}


/* =========================================================
   MANCHES
   ========================================================= */

.round-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.round-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.round-header h3 {
    margin: 0;
    flex: 1;
}

.round-number-small {
    font-size: 13px;
    font-weight: normal;
    color: #999;
}

.round-name {
    color: #333;
}

.round-order-buttons {
    display: flex;
    flex-direction: row;
    gap: 4px;
    flex-shrink: 0;
}

.round-order-buttons button {
    padding: 7px 11px;
    margin: 0;
}


/* Actions des manches */

.round-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
}

.round-actions button {
    margin: 0;
}

.duplicate-button {
    background: #e5e5e5;
    color: #444;
    padding: 7px 10px;
    font-size: 13px;
}

.delete-round-button {
    background: #B73434;
    color: white;
    padding: 7px 10px;
    font-size: 13px;
}

.start-round-button {
    background: #09463E;
    color: white;
    padding: 7px 10px;
    font-size: 13px;
}


/* =========================================================
   LISTE DES MORCEAUX
   ========================================================= */

.show-tracks-button {
    display: block;
    background: #eee;
    color: #333;
    padding: 7px 12px;
    margin-top: 8px;
    text-align: left;
}

.track-list {
    display: none;
    margin-top: 10px;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 8px;
}

.track-list.visible {
    display: block;
}

.track-count {
    font-size: 14px;
    color: #666;
    margin-bottom: 8px;
}

.track-name {
    padding: 6px 0;
    border-bottom: 1px solid #ddd;
}

.track-name:last-child {
    border-bottom: none;
}


/* =========================================================
   PISTES
   ========================================================= */

.track {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 15px;
}

.track h3 {
    margin-top: 0;
    color: #999;
    transition: color 0.2s ease;
}

.track.playing h3 {
    color: #222;
}


/* Contrôles */

.track-controls {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.track-controls button {
    width: auto;
}


/* Volume */

.volume-container {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 1 auto;
}

.volume-icon {
    font-size: 16px;
    line-height: 1;
}

.volume {
    width: 105px;
    margin: 0;
    accent-color: #48A3AE;
}


/* =========================================================
   AJOUT DE PISTE
   ========================================================= */

.add-track-container {
    text-align: center;
    margin-top: 5px;
}

.add-track-button {
    background: #09463E;
    color: white;
    font-size: 15px;
    padding: 8px 15px;
}


/* =========================================================
   LECTEURS YOUTUBE
   ========================================================= */

.player {
    width: 100%;
    height: 200px;
    margin-top: 12px;
}

.player.hidden-player {
    display: none;
}


/* =========================================================
   LECTEURS REPLIES
   ========================================================= */

.players-toggle-container {
    text-align: center;
    margin-top: 8px;
}

.players-toggle {
    background: #eee;
    color: #444;
    font-size: 11px;
    padding: 5px 10px;
}


/* =========================================================
   ÉCRAN DE JEU
   ========================================================= */

.play-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 10px 14px;
}


/* Organisation compacte */

.play-header-content {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 4px 12px;
    align-items: center;
}


/* Colonne gauche */

.play-game-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.play-game-title {
    font-size: 14px;
    font-weight: bold;
    color: #555;
}

.play-round-number {
    font-size: 13px;
    color: #666;
}

.play-track-count {
    font-size: 13px;
    color: #666;
}


/* Titre de manche */

.play-round-title {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin: 0;
}


/* Pause */

.pause-all {
    width: 100%;
    font-size: 14px;
    padding: 8px;
    margin: 8px 0 0 0;
    background: #B73434;
    color: white;
}


/* Lancer le mix */

.play-all {
    width: 100%;
    font-size: 16px;
    padding: 12px;
    margin: 0;
}


/* Navigation */

.play-navigation {
    display: flex;
    align-items: stretch;
    gap: 10px;
    margin-top: 10px;
}

.navigation-left {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 0 0 155px;
}

.navigation-left button {
    margin: 0;
}

.play-navigation .next-round,
.play-navigation .finish-game {
    flex: 1;
    font-size: 16px;
    padding: 12px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    main {
        padding: 10px;
    }

    header h1 {
        font-size: 24px;
    }

    button {
        width: 100%;
        margin: 4px 0;
    }

    .track-controls button {
        width: auto;
    }

    .round-header {
        align-items: flex-start;
    }

    .round-order-buttons {
        flex-direction: row;
    }

    .round-order-buttons button {
        width: auto;
    }

    .round-actions {
        flex-wrap: nowrap;
    }

    .round-actions button {
        width: auto;
        flex: 1;
    }

    .play-header {
        padding: 8px 10px;
    }

    .play-header-content {
        grid-template-columns: 1fr 1.7fr;
        gap: 4px 8px;
    }

    .play-round-title {
        font-size: 20px;
    }

    .volume {
        width: 90px;
    }

    .play-navigation {
        align-items: stretch;
    }

    .navigation-left {
        flex-basis: 125px;
    }

}

</style></head><body><header>
    <h1>🙉 Blindtest Mix</h1>
</header><main><!-- ==================================================
     ÉCRAN : LISTE DES PARTIES
     ================================================== --><section id="gamesScreen" class="screen active"><div class="card">

    <h2>🎮 Mes parties</h2>

    <button class="primary" onclick="showCreateGame()">
        ＋ Nouvelle partie
    </button>

    <div class="filter-container">

        <label for="creatorFilter">
            Filtrer par créateur
        </label>

        <select
            id="creatorFilter"
            onchange="renderGames()">

            <option value="">
                Tous les créateurs
            </option>

        </select>

    </div>

</div>

<div id="gamesList"></div>

</section><!-- ==================================================
     ÉCRAN : CRÉER UNE PARTIE
     ================================================== --><section id="createGameScreen" class="screen"><div class="card">

    <h2>🎮 Nouvelle partie</h2>

    <label>Nom de la partie</label>

    <input
        id="gameName"
        type="text"
        placeholder="Ex : Blind Test Noël">

    <label>Créé par</label>

    <input
        id="gameCreator"
        type="text"
        placeholder="Ton prénom">

    <label>
        Mot de passe (facultatif)
    </label>

    <div class="password-container">

        <input
            id="gamePassword"
            type="password"
            placeholder="Laisser vide si aucun mot de passe">

        <button
            type="button"
            class="secondary"
            onclick="togglePassword('gamePassword', this)">

            👁️

        </button>

    </div>

    <button class="primary" onclick="createGame()">
        💾 Créer la partie
    </button>

    <button class="secondary" onclick="showGames()">
        ← Retour
    </button>

</div>

</section><!-- ==================================================
     ÉCRAN : GESTION D'UNE PARTIE
     ================================================== --><section id="gameScreen" class="screen"><div class="card">

    <h2 id="gameTitle"></h2>

    <p id="gameCreatorDisplay"></p>

    <button class="primary" onclick="showCreateRound()">
        ＋ Ajouter une manche
    </button>

    <button class="blue" onclick="startGame()">
        🎮 Jouer la partie
    </button>

    <button class="light" onclick="showEditGame()">
        ⚙️ Modifier informations partie
    </button>

    <button class="secondary" onclick="showGames()">
        ← Mes parties
    </button>

</div>

<div id="roundsList"></div>

</section><!-- ==================================================
     MODIFIER UNE PARTIE
     ================================================== --><section id="editGameScreen" class="screen"><div class="card">

    <h2>⚙️ Modifier les informations</h2>

    <label>Nom de la partie</label>

    <input id="editGameName" type="text">

    <label>Créé par</label>

    <input id="editGameCreator" type="text">

    <label>Mot de passe</label>

    <div class="password-container">

        <input
            id="editGamePassword"
            type="password"
            placeholder="Laisser vide pour supprimer le mot de passe">

        <button
            type="button"
            class="secondary"
            onclick="togglePassword('editGamePassword', this)">

            👁️

        </button>

    </div>

    <button class="primary" onclick="saveGameChanges()">
        💾 Enregistrer les modifications
    </button>

    <button class="danger" onclick="deleteCurrentGame()">
        🗑️ Supprimer cette partie
    </button>

    <button class="secondary" onclick="showGame()">
        ← Retour
    </button>

</div>

</section><!-- ==================================================
     CRÉER UNE MANCHE
     ================================================== --><section id="createRoundScreen" class="screen"><div class="card">

    <h2>🎵 Nouvelle manche</h2>

    <label>Nom de la manche</label>

    <input
        id="roundName"
        type="text"
        placeholder="Ex : Années 2000">

    <button class="primary" onclick="createRound()">
        💾 Créer la manche
    </button>

    <button class="secondary" onclick="showGame()">
        ← Retour
    </button>

</div>

</section><!-- ==================================================
     MODIFIER UNE MANCHE
     ================================================== --><section id="editRoundScreen" class="screen"><div class="card">

    <h2 id="editRoundTitle"></h2>

    <p>
        Ajoute jusqu'à 7 liens YouTube.
    </p>

    <div id="editTracks"></div>

    <div class="add-track-container">

        <button
            id="addTrackButton"
            class="add-track-button"
            onclick="addTrack()">

            ＋ Ajouter une piste

        </button>

    </div>

    <button class="primary" onclick="saveRound()">
        💾 Enregistrer la manche
    </button>

    <button class="secondary" onclick="showGame()">
        ← Retour
    </button>

</div>

</section><!-- ==================================================
     ÉCRAN DE JEU
     ================================================== --><section id="playScreen" class="screen"><div class="card play-header">

    <div class="play-header-content">

        <div class="play-game-info">

            <div
                id="playGameTitle"
                class="play-game-title">
            </div>

            <div
                id="playRoundNumber"
                class="play-round-number">
            </div>

            <div
                id="playTrackCount"
                class="play-track-count">
            </div>

        </div>

        <div
            id="playRoundTitle"
            class="play-round-title">
        </div>

    </div>

    <button
        class="pause-all"
        onclick="pauseAll()">

        ⏸️ PAUSE TOUT

    </button>

</div>


<div class="card">

    <button
        class="play-button play-all"
        onclick="playAll()">

        ▶️ LANCER LE MIX

    </button>

    <div class="players-toggle-container">

        <button
            class="players-toggle"
            onclick="togglePlayers(this)">

            👁️ Afficher tous les lecteurs

        </button>

    </div>

</div>


<div id="playTracks"></div>


<div class="play-navigation">

    <div class="navigation-left">

        <button
            class="previous-round"
            onclick="previousRound()">

            ← Manche précédente

        </button>

        <button
            class="quit-game"
            onclick="quitGame()">

            ✖ Quitter

        </button>

    </div>

    <button
        id="nextRoundButton"
        class="next-round"
        onclick="nextRound()">

        ➡️ Manche suivante

    </button>

</div>

</section></main><!-- ======================================================
     API YOUTUBE
     ====================================================== --><script src="https://www.youtube.com/iframe_api"></script><script>

/* ========================================================
   VARIABLES PRINCIPALES
   ======================================================== */

let games = [];

let currentGameId = null;

let currentRoundId = null;

let players = [];

let playersVisible = false;


/* ========================================================
   CHARGEMENT DES DONNÉES
   ======================================================== */

function loadData() {

    const savedGames =
        localStorage.getItem("blindMixGames");

    if (savedGames) {
        games = JSON.parse(savedGames);
    }

}


/* ========================================================
   SAUVEGARDE
   ======================================================== */

function saveData() {

    localStorage.setItem(
        "blindMixGames",
        JSON.stringify(games)
    );

}


/* ========================================================
   CHANGER D'ÉCRAN
   ======================================================== */

function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(function(screen) {
            screen.classList.remove("active");
        });

    document
        .getElementById(screenId)
        .classList.add("active");

}


/* ========================================================
   ÉCRAN DES PARTIES
   ======================================================== */

function showGames() {

    showScreen("gamesScreen");

    renderGames();

}


/* ========================================================
   AFFICHER LES PARTIES
   ======================================================== */

function renderGames() {

    const container =
        document.getElementById("gamesList");

    const filter =
        document.getElementById("creatorFilter");

    const selectedCreator =
        filter.value;

    const creators =
        [...new Set(
            games.map(function(game) {
                return game.creator;
            })
        )].sort();

    filter.innerHTML =
        '<option value="">Tous les créateurs</option>';

    creators.forEach(function(creator) {

        const option =
            document.createElement("option");

        option.value = creator;

        option.textContent = creator;

        if (creator === selectedCreator) {
            option.selected = true;
        }

        filter.appendChild(option);

    });

    container.innerHTML = "";

    const filteredGames =
        games.filter(function(game) {

            return !selectedCreator ||
                   game.creator === selectedCreator;

        });

    if (filteredGames.length === 0) {

        container.innerHTML =
            "<div class='card'>" +
            "Aucune partie pour le moment." +
            "</div>";

        return;

    }

    filteredGames.forEach(function(game) {

        const div =
            document.createElement("div");

        div.className = "game-card";

        const passwordIcon =
            game.password
            ? " 🔒"
            : "";

        div.innerHTML = `

            <h3>
                🎶 ${escapeHTML(game.name)}
                ${passwordIcon}
            </h3>

            <div class="game-info">

                <span class="creator-label">
                    Créé par :
                </span>

                <span class="creator-name">
                    ${escapeHTML(game.creator)}
                </span>

            </div>

            <div class="game-info">
                ${game.rounds.length} manche(s)
            </div>

            <button
                class="blue"
                onclick="openGame('${game.id}')">

                Ouvrir

            </button>

            <button
                class="danger"
                onclick="deleteGame('${game.id}')">

                Supprimer

            </button>

        `;

        container.appendChild(div);

    });

}


/* ========================================================
   CRÉER UNE PARTIE
   ======================================================== */

function showCreateGame() {

    document.getElementById("gameName").value = "";

    document.getElementById("gameCreator").value = "";

    document.getElementById("gamePassword").value = "";

    showScreen("createGameScreen");

}


function createGame() {

    const name =
        document.getElementById("gameName").value.trim();

    const creator =
        document.getElementById("gameCreator").value.trim();

    const password =
        document.getElementById("gamePassword").value;

    if (!name) {
        alert("Donne un nom à ta partie.");
        return;
    }

    if (!creator) {
        alert("Indique qui a créé la partie.");
        return;
    }

    const game = {

        id: Date.now().toString(),

        name: name,

        creator: creator,

        password: password,

        rounds: []

    };

    games.push(game);

    saveData();

    currentGameId = game.id;

    showGame();

}


/* ========================================================
   AFFICHER / MASQUER MOT DE PASSE
   ======================================================== */

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

    } else {

        input.type = "password";

        button.textContent = "👁️";

    }

}


/* ========================================================
   OUVRIR UNE PARTIE
   ======================================================== */

function openGame(id) {

    const game =
        games.find(function(g) {
            return g.id === id;
        });

    if (!game) {
        return;
    }

    if (game.password) {

        const enteredPassword =
            prompt("Mot de passe de cette partie :");

        if (enteredPassword !== game.password) {

            alert("Mot de passe incorrect.");

            return;

        }

    }

    currentGameId = id;

    showGame();

}


/* ========================================================
   AFFICHER UNE PARTIE
   ======================================================== */

function showGame() {

    const game = getCurrentGame();

    if (!game) {
        return;
    }

    document.getElementById("gameTitle").textContent =
        "🎶 " + game.name;

    document.getElementById("gameCreatorDisplay").innerHTML =
        '<span class="creator-label">Créé par : </span>' +
        '<span class="creator-name">' +
        escapeHTML(game.creator) +
        '</span>';

    renderRounds();

    showScreen("gameScreen");

}


/* ========================================================
   MODIFIER UNE PARTIE
   ======================================================== */

function showEditGame() {

    const game = getCurrentGame();

    if (!game) {
        return;
    }

    document.getElementById("editGameName").value =
        game.name;

    document.getElementById("editGameCreator").value =
        game.creator;

    document.getElementById("editGamePassword").value =
        game.password || "";

    showScreen("editGameScreen");

}


/* ========================================================
   ENREGISTRER MODIFICATIONS PARTIE
   ======================================================== */

function saveGameChanges() {

    const game = getCurrentGame();

    if (!game) {
        return;
    }

    const name =
        document.getElementById("editGameName").value.trim();

    const creator =
        document.getElementById("editGameCreator").value.trim();

    const password =
        document.getElementById("editGamePassword").value;

    if (!name) {
        alert("Donne un nom à ta partie.");
        return;
    }

    if (!creator) {
        alert("Indique qui a créé la partie.");
        return;
    }

    game.name = name;

    game.creator = creator;

    game.password = password;

    saveData();

    alert("Partie modifiée !");

    showGame();

}


/* ========================================================
   SUPPRIMER PARTIE ACTUELLE
   ======================================================== */

function deleteCurrentGame() {

    const game = getCurrentGame();

    if (!game) {
        return;
    }

    if (!confirm(
        "Supprimer cette partie et toutes ses manches ?"
    )) {
        return;
    }

    games =
        games.filter(function(g) {
            return g.id !== game.id;
        });

    currentGameId = null;

    currentRoundId = null;

    saveData();

    showGames();

}


/* ========================================================
   AFFICHER LES MANCHES
   ======================================================== */

function renderRounds() {

    const game = getCurrentGame();

    const container =
        document.getElementById("roundsList");

    container.innerHTML = "";

    if (game.rounds.length === 0) {

        container.innerHTML =
            "<div class='card'>" +
            "Cette partie ne contient encore aucune manche." +
            "</div>";

        return;

    }

    game.rounds.forEach(function(round, index) {

        const div =
            document.createElement("div");

        div.className = "round-card";

        const realTracks =
            round.tracks.filter(function(track) {
                return track.url &&
                       track.url.trim() !== "";
            });

        let trackNames = "";

        realTracks.forEach(function(track) {

            trackNames += `
                <div class="track-name">
                    🎵 ${escapeHTML(track.title)}
                </div>
            `;

        });

        let trackText;

        if (realTracks.length === 0) {
            trackText = "0 morceau";
        } else if (realTracks.length === 1) {
            trackText = "1 morceau";
        } else {
            trackText = realTracks.length + " morceaux";
        }

        div.innerHTML = `

            <div class="round-header">

                <h3>

                    <span class="round-number-small">
                        Manche ${index + 1}
                    </span>

                    <span class="round-name">
                        — ${escapeHTML(round.name)}
                    </span>

                </h3>

                <div class="round-order-buttons">

                    <button
                        class="light"
                        onclick="moveRoundUp('${round.id}')"
                        ${index === 0 ? "disabled" : ""}>

                        ↑

                    </button>

                    <button
                        class="light"
                        onclick="moveRoundDown('${round.id}')"
                        ${index === game.rounds.length - 1 ? "disabled" : ""}>

                        ↓

                    </button>

                </div>

            </div>

            ${
                realTracks.length > 0
                ? `
                    <button
                        class="show-tracks-button"
                        onclick="toggleTrackList('${round.id}', this)">

                        ▶️ Voir les morceaux

                    </button>

                    <div
                        id="track-list-${round.id}"
                        class="track-list">

                        <div class="track-count">
                            ${trackText}
                        </div>

                        ${trackNames}

                    </div>
                `
                : ""
            }

            <div class="round-actions">

                <button
                    class="blue"
                    onclick="editRound('${round.id}')">

                    ✏️ Modifier

                </button>

                <button
                    class="start-round-button"
                    onclick="startSpecificRound('${round.id}')">

                    ▶️ Jouer

                </button>

                <button
                    class="duplicate-button"
                    onclick="duplicateRound('${round.id}')">

                    📋 Dupliquer

                </button>

                <button
                    class="delete-round-button"
                    onclick="deleteRound('${round.id}')">

                    🗑️ Supprimer

                </button>

            </div>

        `;

        container.appendChild(div);

    });

}


/* ========================================================
   AFFICHER / MASQUER MORCEAUX
   ======================================================== */

function toggleTrackList(roundId, button) {

    const list =
        document.getElementById(
            "track-list-" + roundId
        );

    if (!list) {
        return;
    }

    if (list.classList.contains("visible")) {

        list.classList.remove("visible");

        button.textContent =
            "▶️ Voir les morceaux";

    } else {

        list.classList.add("visible");

        button.textContent =
            "▼ Masquer les morceaux";

    }

}


/* ========================================================
   DÉPLACER MANCHE HAUT
   ======================================================== */

function moveRoundUp(roundId) {

    const game = getCurrentGame();

    const index =
        game.rounds.findIndex(function(round) {
            return round.id === roundId;
        });

    if (index <= 0) {
        return;
    }

    const temp =
        game.rounds[index - 1];

    game.rounds[index - 1] =
        game.rounds[index];

    game.rounds[index] =
        temp;

    saveData();

    renderRounds();

}


/* ========================================================
   DÉPLACER MANCHE BAS
   ======================================================== */

function moveRoundDown(roundId) {

    const game = getCurrentGame();

    const index =
        game.rounds.findIndex(function(round) {
            return round.id === roundId;
        });

    if (
        index === -1 ||
        index >= game.rounds.length - 1
    ) {
        return;
    }

    const temp =
        game.rounds[index + 1];

    game.rounds[index + 1] =
        game.rounds[index];

    game.rounds[index] =
        temp;

    saveData();

    renderRounds();

}


/* ========================================================
   JOUER LA PARTIE DEPUIS LE DÉBUT
   ======================================================== */

function startGame() {

    const game = getCurrentGame();

    if (!game) {
        return;
    }

    if (game.rounds.length === 0) {

        alert("Cette partie ne contient aucune manche.");

        return;

    }

    currentRoundId =
        game.rounds[0].id;

    loadRoundForPlaying();

}


/* ========================================================
   JOUER UNE MANCHE SPÉCIFIQUE
   ======================================================== */

function startSpecificRound(roundId) {

    currentRoundId = roundId;

    loadRoundForPlaying();

}


/* ========================================================
   CRÉER UNE MANCHE
   ======================================================== */

function showCreateRound() {

    document.getElementById("roundName").value = "";

    showScreen("createRoundScreen");

}


function createRound() {

    const name =
        document.getElementById("roundName").value.trim();

    if (!name) {
        alert("Donne un nom à ta manche.");
        return;
    }

    const game = getCurrentGame();

    const round = {

        id: Date.now().toString(),

        name: name,

        tracks: [
            {
                title: "Piste 1",
                url: ""
            }
        ]

    };

    game.rounds.push(round);

    saveData();

    editRound(round.id);

}


/* ========================================================
   MODIFIER UNE MANCHE
   ======================================================== */

function editRound(roundId) {

    currentRoundId = roundId;

    const game = getCurrentGame();

    const round =
        game.rounds.find(function(r) {
            return r.id === roundId;
        });

    if (!round) {
        return;
    }

    document.getElementById("editRoundTitle").textContent =
        "🎵 " + round.name;

    renderEditTracks(round);

    showScreen("editRoundScreen");

}


/* ========================================================
   AFFICHER PISTES PRÉPARATION
   ======================================================== */

function renderEditTracks(round) {

    const container =
        document.getElementById("editTracks");

    container.innerHTML = "";

    round.tracks.forEach(function(track, index) {

        const div =
            document.createElement("div");

        div.className = "track";

        div.innerHTML = `

            <h3>🎵 Piste ${index + 1}</h3>

            <label>
                Nom / réponse
            </label>

            <input
                id="title-${index}"
                type="text"
                value="${escapeAttribute(track.title)}"
                placeholder="Ex : Michael Jackson">

            <label>
                Lien YouTube
            </label>

            <input
                id="url-${index}"
                type="text"
                value="${escapeAttribute(track.url)}"
                placeholder="Colle ici le lien YouTube">

        `;

        container.appendChild(div);

    });

    const addButton =
        document.getElementById("addTrackButton");

    if (round.tracks.length >= 7) {

        addButton.style.display = "none";

    } else {

        addButton.style.display = "inline-block";

    }

}


/* ========================================================
   AJOUTER UNE PISTE
   ======================================================== */

function addTrack() {

    const game = getCurrentGame();

    const round =
        game.rounds.find(function(r) {
            return r.id === currentRoundId;
        });

    if (!round) {
        return;
    }

    if (round.tracks.length >= 7) {

        alert("Maximum 7 pistes par manche.");

        return;

    }

    saveCurrentTrackInputs();

    round.tracks.push({
        title: "Piste " + (round.tracks.length + 1),
        url: ""
    });

    renderEditTracks(round);

}


/* ========================================================
   SAUVEGARDER TEMPORAIREMENT LES CHAMPS DES PISTES
   ======================================================== */

function saveCurrentTrackInputs() {

    const game = getCurrentGame();

    const round =
        game.rounds.find(function(r) {
            return r.id === currentRoundId;
        });

    if (!round) {
        return;
    }

    round.tracks.forEach(function(track, index) {

        const titleInput =
            document.getElementById("title-" + index);

        const urlInput =
            document.getElementById("url-" + index);

        if (titleInput) {
            track.title = titleInput.value;
        }

        if (urlInput) {
            track.url = urlInput.value;
        }

    });

}


/* ========================================================
   ENREGISTRER MANCHE
   ======================================================== */

function saveRound() {

    const game = getCurrentGame();

    const round =
        game.rounds.find(function(r) {
            return r.id === currentRoundId;
        });

    if (!round) {
        return;
    }

    saveCurrentTrackInputs();

    saveData();

    alert("Manche enregistrée !");

    showGame();

}


/* ========================================================
   DUPLIQUER MANCHE
   ======================================================== */

function duplicateRound(roundId) {

    const game = getCurrentGame();

    const original =
        game.rounds.find(function(r) {
            return r.id === roundId;
        });

    if (!original) {
        return;
    }

    const copy =
        JSON.parse(JSON.stringify(original));

    copy.id =
        Date.now().toString();

    copy.name =
        original.name + " - Copie";

    game.rounds.push(copy);

    saveData();

    renderRounds();

}


/* ========================================================
   SUPPRIMER MANCHE
   ======================================================== */

function deleteRound(roundId) {

    if (!confirm("Supprimer cette manche ?")) {
        return;
    }

    const game = getCurrentGame();

    game.rounds =
        game.rounds.filter(function(round) {
            return round.id !== roundId;
        });

    saveData();

    renderRounds();

}


/* ========================================================
   SUPPRIMER PARTIE
   ======================================================== */

function deleteGame(gameId) {

    if (!confirm(
        "Supprimer cette partie et toutes ses manches ?"
    )) {
        return;
    }

    games =
        games.filter(function(game) {
            return game.id !== gameId;
        });

    saveData();

    renderGames();

}


/* ========================================================
   CHARGER UNE MANCHE POUR LE JEU
   ======================================================== */

function loadRoundForPlaying() {

    const game = getCurrentGame();

    const round =
        game.rounds.find(function(r) {
            return r.id === currentRoundId;
        });

    if (!round) {
        return;
    }

    players = [];

    playersVisible = false;

    const roundIndex =
        game.rounds.findIndex(function(r) {
            return r.id === currentRoundId;
        });

    document.getElementById("playGameTitle").textContent =
        "🎶 " + game.name;

    document.getElementById("playRoundNumber").textContent =
        "Manche " +
        (roundIndex + 1) +
        " / " +
        game.rounds.length;

    document.getElementById("playRoundTitle").textContent =
        round.name;

    renderPlayTracks(round);

    updatePlayingCount();

    updateNavigationButton();

    showScreen("playScreen");

}


/* ========================================================
   AFFICHER LES PISTES EN JEU
   ======================================================== */

function renderPlayTracks(round) {

    const container =
        document.getElementById("playTracks");

    container.innerHTML = "";

    const tracksWithVideo =
        round.tracks.filter(function(track) {

            return track.url &&
                   track.url.trim() !== "" &&
                   getVideoId(track.url);

        });


    tracksWithVideo.forEach(function(track, index) {

        const videoId =
            getVideoId(track.url);

        const div =
            document.createElement("div");

        div.className = "track";

        div.id = "track-card-" + index;

        const isFirst =
            index === 0;


        div.innerHTML = `

            <h3>
                🎵 ${escapeHTML(track.title)}
            </h3>

            <div class="track-controls">

                <button
                    class="play-button"
                    onclick="playTrack(${index})">

                    ▶️

                </button>

                <button
                    class="pause-button"
                    onclick="pauseTrack(${index})">

                    ⏸️

                </button>

                <div class="volume-container">

                    <span class="volume-icon">
                        🔊
                    </span>

                    <input
                        class="volume"
                        type="range"
                        min="0"
                        max="100"
                        value="100"
                        oninput="changeVolume(${index}, this.value)">

                </div>

                <button
                    class="light"
                    onclick="toggleSinglePlayer(${index}, this)">

                    👁️

                </button>

            </div>


            <div
                id="player-${index}"
                class="player ${isFirst ? "" : "hidden-player"}">
            </div>

        `;

        container.appendChild(div);

        createPlayer(
            index,
            videoId
        );

    });


    const toggleButton =
        document.querySelector(".players-toggle");


    if (toggleButton) {

        if (tracksWithVideo.length <= 1) {

            toggleButton.style.display = "none";

        } else {

            toggleButton.style.display = "inline-block";

            toggleButton.textContent =
                "👁️ Afficher tous les lecteurs";

        }

    }

}


/* ========================================================
   AFFICHER / MASQUER UN LECTEUR
   ======================================================== */

function toggleSinglePlayer(index, button) {

    const playerElement =
        document.getElementById(
            "player-" + index
        );

    if (!playerElement) {
        return;
    }

    if (
        playerElement.classList.contains(
            "hidden-player"
        )
    ) {

        playerElement.classList.remove(
            "hidden-player"
        );

        button.textContent = "🙈";

    } else {

        playerElement.classList.add(
            "hidden-player"
        );

        button.textContent = "👁️";

    }

}


/* ========================================================
   AFFICHER / MASQUER TOUS LES LECTEURS
   ======================================================== */

function togglePlayers(button) {

    const playerElements =
        document.querySelectorAll(".player");

    playersVisible =
        !playersVisible;

    playerElements.forEach(function(player) {

        if (playersVisible) {

            player.classList.remove(
                "hidden-player"
            );

        } else {

            player.classList.add(
                "hidden-player"
            );

        }

    });

    if (playersVisible) {

        button.textContent =
            "🙈 Masquer tous les lecteurs";

    } else {

        button.textContent =
            "👁️ Afficher tous les lecteurs";

    }

}


/* ========================================================
   EXTRAIRE ID YOUTUBE
   ======================================================== */

function getVideoId(url) {

    try {

        const urlObject =
            new URL(url);

        if (
            urlObject.hostname.includes("youtube.com")
        ) {

            return urlObject.searchParams.get("v");

        }

        if (
            urlObject.hostname.includes("youtu.be")
        ) {

            return urlObject.pathname.substring(1);

        }

    } catch (error) {

        return null;

    }

    return null;

}


/* ========================================================
   CRÉER LECTEUR YOUTUBE
   ======================================================== */

function createPlayer(index, videoId) {

    players[index] =
        new YT.Player(
            "player-" + index,
            {

                videoId: videoId,

                playerVars: {

                    autoplay: 0,

                    controls: 1,

                    rel: 0,

                    playsinline: 1

                },

                events: {

                    onReady: function(event) {

                        event.target.setVolume(100);

                    },

                    onStateChange: function(event) {

                        updateTrackPlayingState(
                            index,
                            event.data
                        );

                    }

                }

            }
        );

}


/* ========================================================
   API YOUTUBE PRÊTE
   ======================================================== */

function onYouTubeIframeAPIReady() {

    console.log(
        "API YouTube prête"
    );

}


/* ========================================================
   ÉTAT VISUEL DES PISTES
   ======================================================== */

function updateTrackPlayingState(index, state) {

    const card =
        document.getElementById(
            "track-card-" + index
        );

    if (!card) {
        return;
    }

    if (state === YT.PlayerState.PLAYING) {

        card.classList.add("playing");

    } else {

        card.classList.remove("playing");

    }

    updatePlayingCount();

}


/* ========================================================
   COMPTEUR DE MUSIQUES EN COURS
   ======================================================== */

function updatePlayingCount() {

    let playing = 0;

    players.forEach(function(player) {

        if (
            player &&
            typeof player.getPlayerState === "function"
        ) {

            if (
                player.getPlayerState() ===
                YT.PlayerState.PLAYING
            ) {

                playing++;

            }

        }

    });


    document.getElementById(
        "playTrackCount"
    ).textContent =
        playing +
        " / " +
        players.length +
        " à trouver";

}


/* ========================================================
   LIRE UNE PISTE
   ======================================================== */

function playTrack(index) {

    if (
        players[index] &&
        typeof players[index].playVideo === "function"
    ) {

        players[index].playVideo();

    }

}


/* ========================================================
   PAUSE D'UNE PISTE
   ======================================================== */

function pauseTrack(index) {

    if (
        players[index] &&
        typeof players[index].pauseVideo === "function"
    ) {

        players[index].pauseVideo();

    }

}


/* ========================================================
   VOLUME
   ======================================================== */

function changeVolume(index, volume) {

    if (
        players[index] &&
        typeof players[index].setVolume === "function"
    ) {

        players[index].setVolume(
            Number(volume)
        );

    }

}


/* ========================================================
   LANCER TOUT
   ======================================================== */

function playAll() {

    players.forEach(function(player) {

        if (
            player &&
            typeof player.playVideo === "function"
        ) {

            player.playVideo();

        }

    });

}


/* ========================================================
   PAUSE TOUT
   ======================================================== */

function pauseAll() {

    players.forEach(function(player) {

        if (
            player &&
            typeof player.pauseVideo === "function"
        ) {

            player.pauseVideo();

        }

    });

}


/* ========================================================
   MANCHE SUIVANTE
   ======================================================== */

function nextRound() {

    const game = getCurrentGame();

    const currentIndex =
        game.rounds.findIndex(function(round) {
            return round.id === currentRoundId;
        });


    if (
        currentIndex >= game.rounds.length - 1
    ) {

        pauseAll();

        showGame();

        return;

    }


    pauseAll();

    currentRoundId =
        game.rounds[currentIndex + 1].id;

    loadRoundForPlaying();

}


/* ========================================================
   MANCHE PRÉCÉDENTE
   ======================================================== */

function previousRound() {

    const game = getCurrentGame();

    const currentIndex =
        game.rounds.findIndex(function(round) {
            return round.id === currentRoundId;
        });


    if (currentIndex <= 0) {

        alert(
            "Tu es déjà à la première manche."
        );

        return;

    }


    pauseAll();

    currentRoundId =
        game.rounds[currentIndex - 1].id;

    loadRoundForPlaying();

}


/* ========================================================
   QUITTER LA PARTIE
   ======================================================== */

function quitGame() {

    pauseAll();

    showGame();

}


/* ========================================================
   BOUTON DERNIÈRE MANCHE
   ======================================================== */

function updateNavigationButton() {

    const game = getCurrentGame();

    const currentIndex =
        game.rounds.findIndex(function(round) {
            return round.id === currentRoundId;
        });

    const button =
        document.getElementById(
            "nextRoundButton"
        );


    if (
        currentIndex ===
        game.rounds.length - 1
    ) {

        button.classList.remove(
            "next-round"
        );

        button.classList.add(
            "finish-game"
        );

        button.textContent =
            "🏁 Fin de la partie, retour au menu";

    } else {

        button.classList.remove(
            "finish-game"
        );

        button.classList.add(
            "next-round"
        );

        button.textContent =
            "➡️ Manche suivante";

    }

}


/* ========================================================
   PARTIE ACTUELLE
   ======================================================== */

function getCurrentGame() {

    return games.find(function(game) {
        return game.id === currentGameId;
    });

}


/* ========================================================
   PROTECTION HTML
   ======================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(text) {

    return escapeHTML(text);

}


/* ========================================================
   DÉMARRAGE
   ======================================================== */

loadData();

showGames();

</script></body>
  </html>
